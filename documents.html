<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Documents | Nationwide Dispatching</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- LED Theme Styles -->
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #f2f2f2;
    }

    .sidebar {
        width: 250px;
        height: 100vh;
        background: #111;
        position: fixed;
        top: 0;
        left: 0;
        padding-top: 20px;
        border-right: 2px solid gold;
    }

    .sidebar h2 {
        text-align: center;
        color: gold;
        margin-bottom: 30px;
        font-size: 22px;
    }

    .sidebar a {
        display: block;
        padding: 15px 20px;
        color: #f2f2f2;
        text-decoration: none;
        font-size: 18px;
        border-bottom: 1px solid #222;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background: gold;
        color: black;
    }

    .content {
        margin-left: 260px;
        padding: 20px;
    }

    h1 {
        color: gold;
        font-size: 28px;
        margin-bottom: 20px;
    }

    .upload-box {
        background: #1a1a1a;
        padding: 20px;
        border: 2px solid gold;
        border-radius: 8px;
        margin-bottom: 25px;
    }

    label {
        font-size: 18px;
        color: gold;
    }

    input[type="file"] {
        margin-top: 10px;
        margin-bottom: 15px;
        color: #f2f2f2;
    }

    .btn {
        background: gold;
        color: black;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #d4af37;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #1a1a1a;
        border: 2px solid gold;
    }

    th, td {
        padding: 12px;
        border: 1px solid #333;
        text-align: left;
    }

    th {
        background: gold;
        color: black;
        font-size: 18px;
    }

    tr:nth-child(even) {
        background: #141414;
    }

    a.view-link {
        color: gold;
        text-decoration: underline;
    }
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

</head>
<body>

<div class="sidebar">
    <h2>Dispatch Panel</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="loads.html">Loads</a>
    <a href="carriers.html">Carriers</a>
    <a href="documents.html" style="background: gold; color: black;">Documents</a>
    <a href="admin.html">Admin</a>
    <a href="dispatcher-login.html">Logout</a>
</div>

<div class="content">
    <h1>Documents</h1>

    <div class="upload-box">
        <label>Upload Document</label><br>
        <input type="file" id="fileInput">
        <button class="btn" onclick="uploadDocument()">Upload</button>
        <p id="uploadStatus"></p>
    </div>

    <h1>Uploaded Documents</h1>

    <table>
        <thead>
            <tr>
                <th>Type</th>
                <th>File</th>
                <th>Uploaded</th>
            </tr>
        </thead>
        <tbody id="documentsTable"></tbody>
    </table>
</div>

<script>
const db = firebase.firestore();
const storage = firebase.storage();

function uploadDocument() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) {
        document.getElementById("uploadStatus").innerText = "Please select a file.";
        return;
    }

    const storageRef = storage.ref("documents/" + file.name);
    const uploadTask = storageRef.put(file);

    uploadTask.on("state_changed", null, error => {
        document.getElementById("uploadStatus").innerText = "Upload failed.";
    }, () => {
        uploadTask.snapshot.ref.getDownloadURL().then(url => {
            db.collection("documents").add({
                name: file.name,
                url: url,
                uploaded: new Date().toLocaleString()
            });

            document.getElementById("uploadStatus").innerText = "Upload successful!";
        });
    });
}

db.collection("documents").onSnapshot(snapshot => {
    const table = document.getElementById("documentsTable");
    table.innerHTML = "";

    snapshot.forEach(doc => {
        const data = doc.data();
        const row = `
            <tr>
                <td>${data.name || "N/A"}</td>
                <td><a class="view-link" href="${data.url}" target="_blank">View</a></td>
                <td>${data.uploaded || "N/A"}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
});
</script>

</body>
</html>
