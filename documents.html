<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Documents – Nationwide Dispatching</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</head>

<body class="flex bg-gray-100">

<!-- Sidebar -->
<div class="w-64 bg-blue-800 text-white min-h-screen p-6">
    <h2 class="text-2xl font-bold mb-8">Nationwide Dispatching</h2>

    <a href="dashboard.html" class="block py-3 hover:bg-blue-700 rounded">Dashboard</a>
    <a href="loads.html" class="block py-3 hover:bg-blue-700 rounded">Loads</a>
    <a href="carriers.html" class="block py-3 hover:bg-blue-700 rounded">Carriers</a>
    <a href="documents.html" class="block py-3 hover:bg-blue-700 rounded bg-blue-700">Documents</a>
    <a href="admin.html" class="block py-3 hover:bg-blue-700 rounded">Admin</a>

    <button onclick="logout()" class="mt-10 bg-red-600 w-full py-3 rounded hover:bg-red-700">
        Logout
    </button>
</div>

<!-- Main Content -->
<div class="flex-1 p-10">
    <h1 class="text-3xl font-bold mb-6">Documents</h1>

    <!-- Upload Section -->
    <div class="bg-white p-6 rounded shadow mb-8">
        <h2 class="text-xl font-bold mb-4">Upload Document</h2>

        <select id="docType" class="p-3 border rounded w-full mb-4">
            <option value="POD">POD</option>
            <option value="BOL">BOL</option>
            <option value="RateCon">Rate Confirmation</option>
            <option value="COI">COI</option>
            <option value="W9">W-9</option>
            <option value="MCAuthority">MC Authority</option>
            <option value="DriverDocs">Driver Documents</option>
        </select>

        <input id="fileInput" type="file" class="mb-4">

        <button onclick="uploadDocument()"
                class="bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
            Upload
        </button>

        <p id="uploadStatus" class="mt-4 text-green-600"></p>
    </div>

    <!-- Documents List -->
    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Uploaded Documents</h2>

        <table class="w-full text-left">
            <thead>
                <tr class="border-b">
                    <th class="py-3">Type</th>
                    <th class="py-3">File</th>
                    <th class="py-3">Uploaded</th>
                </tr>
            </thead>
            <tbody id="docsTable"></tbody>
        </table>
    </div>
</div>

<script>
const db = firebase.firestore();
const storage = firebase.storage();

// Upload document
function uploadDocument() {
    const file = document.getElementById("fileInput").files[0];
    const type = document.getElementById("docType").value;

    if (!file) {
        alert("Please select a file.");
        return;
    }

    const filePath = `documents/${type}/${Date.now()}_${file.name}`;
    const uploadTask = storage.ref(filePath).put(file);

    uploadTask.on("state_changed", null, err => {
        console.error(err);
    }, () => {
        uploadTask.snapshot.ref.getDownloadURL().then(url => {
            db.collection("documents").add({
                type: type,
                url: url,
                uploaded: new Date()
            });

            document.getElementById("uploadStatus").innerText = "Upload successful!";
        });
    });
}

// Load documents
db.collection("documents").orderBy("uploaded", "desc").onSnapshot(snapshot => {
    const table = document.getElementById("docsTable");
    table.innerHTML = "";

    snapshot.forEach(doc => {
        const d = doc.data();

        const row = `
            <tr class="border-b">
                <td class="py-3">${d.type}</td>
                <td class="py-3"><a href="${d.url}" target="_blank" class="text-blue-600 underline">View</a></td>
                <td class="py-3">${d.uploaded.toDate().toLocaleString()}</td>
            </tr>
        `;

        table.innerHTML += row;
    });
});
</script>

</body>
</html>
