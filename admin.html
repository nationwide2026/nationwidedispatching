<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Nationwide Dispatching</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</head>

<body class="flex bg-gray-100">

<!-- Sidebar -->
<div class="w-64 bg-blue-800 text-white min-h-screen p-6">
    <h2 class="text-2xl font-bold mb-8">Nationwide Dispatching</h2>

    <a href="dashboard.html" class="block py-3 hover:bg-blue-700 rounded">Dashboard</a>
    <a href="loads.html" class="block py-3 hover:bg-blue-700 rounded">Loads</a>
    <a href="carriers.html" class="block py-3 hover:bg-blue-700 rounded">Carriers</a>
    <a href="documents.html" class="block py-3 hover:bg-blue-700 rounded">Documents</a>
    <a href="admin.html" class="block py-3 hover:bg-blue-700 rounded bg-blue-700">Admin</a>

    <button onclick="logout()" class="mt-10 bg-red-600 w-full py-3 rounded hover:bg-red-700">
        Logout
    </button>
</div>

<!-- Main Content -->
<div class="flex-1 p-10">
    <h1 class="text-3xl font-bold mb-6">Admin Panel</h1>

    <!-- Create User -->
    <div class="bg-white p-6 rounded shadow mb-8">
        <h2 class="text-xl font-bold mb-4">Create User</h2>

        <input id="newEmail" type="email" placeholder="Email"
               class="p-3 border rounded w-full mb-4">

        <input id="newPassword" type="password" placeholder="Password"
               class="p-3 border rounded w-full mb-4">

        <select id="newRole" class="p-3 border rounded w-full mb-4">
            <option value="dispatcher">Dispatcher</option>
            <option value="admin">Admin</option>
        </select>

        <button onclick="createUser()"
                class="bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
            Create User
        </button>

        <p id="createStatus" class="mt-4 text-green-600"></p>
    </div>

    <!-- User List -->
    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Users</h2>

        <table class="w-full text-left">
            <thead>
                <tr class="border-b">
                    <th class="py-3">Email</th>
                    <th class="py-3">Role</th>
                </tr>
            </thead>
            <tbody id="usersTable"></tbody>
        </table>
    </div>
</div>

<script>
const db = firebase.firestore();

// Create user
function createUser() {
    const email = document.getElementById("newEmail").value;
    const password = document.getElementById("newPassword").value;
    const role = document.getElementById("newRole").value;

    firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(userCredential => {
            const uid = userCredential.user.uid;

            db.collection("users").doc(uid).set({
                email: email,
                role: role
            });

            document.getElementById("createStatus").innerText = "User created successfully!";
        })
        .catch(err => {
            document.getElementById("createStatus").innerText = err.message;
        });
}

// Load users
db.collection("users").onSnapshot(snapshot => {
    const table = document.getElementById("usersTable");
    table.innerHTML = "";

    snapshot.forEach(doc => {
        const user = doc.data();

        const row = `
            <tr class="border-b">
                <td class="py-3">${user.email}</td>
                <td class="py-3">${user.role}</td>
            </tr>
        `;

        table.innerHTML += row;
    });
});
</script>

</body>
</html>
