<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Nationwide Dispatching</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- LED Theme Styles -->
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #f2f2f2;
    }

    .sidebar {
        width: 250px;
        height: 100vh;
        background: #111;
        position: fixed;
        top: 0;
        left: 0;
        padding-top: 20px;
        border-right: 2px solid gold;
    }

    .sidebar h2 {
        text-align: center;
        color: gold;
        margin-bottom: 30px;
        font-size: 22px;
    }

    .sidebar a {
        display: block;
        padding: 15px 20px;
        color: #f2f2f2;
        text-decoration: none;
        font-size: 18px;
        border-bottom: 1px solid #222;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background: gold;
        color: black;
    }

    .content {
        margin-left: 260px;
        padding: 20px;
    }

    h1 {
        color: gold;
        font-size: 28px;
        margin-bottom: 20px;
    }

    .box {
        background: #1a1a1a;
        padding: 20px;
        border: 2px solid gold;
        border-radius: 8px;
        margin-bottom: 25px;
    }

    label {
        font-size: 18px;
        color: gold;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 15px;
        background: #0d0d0d;
        border: 1px solid gold;
        color: #f2f2f2;
        border-radius: 5px;
    }

    .btn {
        background: gold;
        color: black;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #d4af37;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #1a1a1a;
        border: 2px solid gold;
    }

    th, td {
        padding: 12px;
        border: 1px solid #333;
        text-align: left;
    }

    th {
        background: gold;
        color: black;
        font-size: 18px;
    }

    tr:nth-child(even) {
        background: #141414;
    }
</style>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, setDoc, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Create user
window.createUser = async () => {
    const email = document.getElementById("newEmail").value;
    const password = document.getElementById("newPassword").value;
    const role = document.getElementById("newRole").value;

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        await setDoc(doc(db, "users", uid), {
            email: email,
            role: role
        });

        document.getElementById("createStatus").innerText = "User created successfully!";
    } catch (err) {
        document.getElementById("createStatus").innerText = err.message;
    }
};

// Load users
onSnapshot(collection(db, "users"), (snapshot) => {
    const table = document.getElementById("usersTable");
    table.innerHTML = "";

    snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const row = `
            <tr>
                <td>${data.email}</td>
                <td>${data.role}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
});
</script>

</head>
<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="loads.html">Loads</a>
    <a href="carriers.html">Carriers</a>
    <a href="documents.html">Documents</a>
    <a href="admin.html" style="background: gold; color: black;">Admin</a>
    <a href="dispatcher-login.html">Logout</a>
</div>

<div class="content">
    <h1>Admin – Create User</h1>

    <div class="box">
        <label>Email</label>
        <input id="newEmail" type="email">

        <label>Password</label>
        <input id="newPassword" type="password">

        <label>Role</label>
        <select id="newRole">
            <option value="dispatcher">Dispatcher</option>
            <option value="driver">Driver</option>
            <option value="admin">Admin</option>
        </select>

        <button class="btn" onclick="createUser()">Create User</button>
        <p id="createStatus"></p>
    </div>

    <h1>Users</h1>

    <table>
        <thead>
            <tr>
                <th>Email</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>
</div>

</body>
</html>
