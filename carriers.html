<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carriers | Nationwide Dispatching</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- LED Theme Styles -->
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #f2f2f2;
    }

    .sidebar {
        width: 250px;
        height: 100vh;
        background: #111;
        position: fixed;
        top: 0;
        left: 0;
        padding-top: 20px;
        border-right: 2px solid gold;
    }

    .sidebar h2 {
        text-align: center;
        color: gold;
        margin-bottom: 30px;
        font-size: 22px;
    }

    .sidebar a {
        display: block;
        padding: 15px 20px;
        color: #f2f2f2;
        text-decoration: none;
        font-size: 18px;
        border-bottom: 1px solid #222;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background: gold;
        color: black;
    }

    .content {
        margin-left: 260px;
        padding: 20px;
    }

    h1 {
        color: gold;
        font-size: 28px;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #1a1a1a;
        border: 2px solid gold;
    }

    th, td {
        padding: 12px;
        border: 1px solid #333;
        text-align: left;
    }

    th {
        background: gold;
        color: black;
        font-size: 18px;
    }

    tr:nth-child(even) {
        background: #141414;
    }

    .btn {
        background: gold;
        color: black;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #d4af37;
    }
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

</head>
<body>

<div class="sidebar">
    <h2>Dispatch Panel</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="loads.html">Loads</a>
    <a href="carriers.html" style="background: gold; color: black;">Carriers</a>
    <a href="documents.html">Documents</a>
    <a href="admin.html">Admin</a>
    <a href="dispatcher-login.html">Logout</a>
</div>

<div class="content">
    <h1>Carriers</h1>

    <table>
        <thead>
            <tr>
                <th>Carrier Name</th>
                <th>MC Number</th>
                <th>Phone</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="carriersTable"></tbody>
    </table>
</div>

<script>
const db = firebase.firestore();

db.collection("carriers").onSnapshot(snapshot => {
    const table = document.getElementById("carriersTable");
    table.innerHTML = "";

    snapshot.forEach(doc => {
        const data = doc.data();
        const row = `
            <tr>
                <td>${data.name || "N/A"}</td>
                <td>${data.mc || "N/A"}</td>
                <td>${data.phone || "N/A"}</td>
                <td>${data.email || "N/A"}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
});
</script>

</body>
</html>
