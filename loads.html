<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loads | Nationwide Dispatching</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- LED Theme Styles -->
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #f2f2f2;
    }

    .sidebar {
        width: 250px;
        height: 100vh;
        background: #111;
        position: fixed;
        top: 0;
        left: 0;
        padding-top: 20px;
        border-right: 2px solid gold;
    }

    .sidebar h2 {
        text-align: center;
        color: gold;
        margin-bottom: 30px;
        font-size: 22px;
    }

    .sidebar a {
        display: block;
        padding: 15px 20px;
        color: #f2f2f2;
        text-decoration: none;
        font-size: 18px;
        border-bottom: 1px solid #222;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background: gold;
        color: black;
    }

    .content {
        margin-left: 260px;
        padding: 20px;
    }

    h1 {
        color: gold;
        font-size: 28px;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #1a1a1a;
        border: 2px solid gold;
    }

    th, td {
        padding: 12px;
        border: 1px solid #333;
        text-align: left;
    }

    th {
        background: gold;
        color: black;
        font-size: 18px;
    }

    tr:nth-child(even) {
        background: #141414;
    }

    .btn {
        background: gold;
        color: black;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #d4af37;
    }
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyC2...",
    authDomain: "nationwide-dispatching-7b346.firebaseapp.com",
    projectId: "nationwide-dispatching-7b346",
    storageBucket: "nationwide-dispatching-7b346.appspot.com",
    messagingSenderId: "101010101",
    appId: "1:101010101:web:abc123"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

</head>
<body>

<div class="sidebar">
    <h2>Dispatch Panel</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="loads.html">Loads</a>
    <a href="carriers.html">Carriers</a>
    <a href="documents.html">Documents</a>
    <a href="dispatcher-login.html">Logout</a>
</div>

<div class="content">
    <h1>Loads</h1>

    <table>
        <thead>
            <tr>
                <th>Load #</th>
                <th>Carrier</th>
                <th>Pickup</th>
                <th>Delivery</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="loadsTable"></tbody>
    </table>
</div>

<script>
db.collection("loads").onSnapshot(snapshot => {
    const table = document.getElementById("loadsTable");
    table.innerHTML = "";

    snapshot.forEach(doc => {
        const data = doc.data();
        const row = `
            <tr>
                <td>${data.loadNumber || "N/A"}</td>
                <td>${data.carrier || "N/A"}</td>
                <td>${data.pickup || "N/A"}</td>
                <td>${data.delivery || "N/A"}</td>
                <td>${data.status || "Pending"}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
});
</script>

</body>
</html>
