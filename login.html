<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nationwide Dispatching – Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="firebase-config.js"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-10 rounded-xl shadow-xl w-96">
    <h2 class="text-2xl font-bold text-center mb-6">Dispatcher Login</h2>

    <input id="email" type="email" placeholder="Email"
           class="w-full p-3 border rounded mb-4">

    <input id="password" type="password" placeholder="Password"
           class="w-full p-3 border rounded mb-6">

    <button onclick="login()"
            class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
        Login
    </button>

    <p id="error" class="text-red-600 text-center mt-4"></p>
</div>

<script>
function login() {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email, pass)
        .then(() => {
            window.location.href = "dashboard.html";
        })
        .catch(err => {
            document.getElementById("error").innerText = err.message;
        });
}
</script>

</body>
</html>
