<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dispatcher Login | Nationwide Dispatching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #050505;
      --gold: #ffd700;
      --gold-soft: #e6c45a;
      --text: #f5f5f5;
      --muted: #b0b0b0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #111 0%, #000 55%, #000 100%);
      color: var(--text);
      margin: 0;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,215,0,0.35);
      z-index: 20;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      transition: 0.2s;
      border: 1px solid transparent;
      font-size: 14px;
    }

    nav a:hover {
      border-color: rgba(255,215,0,0.7);
      color: var(--gold);
      box-shadow: 0 0 12px rgba(255,215,0,0.7);
    }

    .nav-cta {
      background: radial-gradient(circle at top, var(--gold) 0%, #e6c45a 40%, #8b6508 100%);
      color: #000;
      font-weight: 600;
      box-shadow:
        0 10px 18px rgba(0,0,0,0.9),
        0 0 16px rgba(255,215,0,0.8);
    }

    main {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    h1 {
      text-align: center;
      color: var(--gold);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    form {
      background: #0b0b0b;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,215,0,0.3);
      box-shadow:
        0 16px 32px rgba(0,0,0,0.9),
        0 0 12px rgba(0,0,0,0.8);
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--gold-soft);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #050505;
      color: var(--text);
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 999px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: var(--gold-soft);
    }

    .error {
      margin-top: 10px;
      color: #ff6b6b;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <div class="nav-inner">
      <div style="color: var(--gold); font-weight: 600; font-size: 18px;">
        Nationwide Dispatching
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a href="dispatcher-login.html" class="nav-cta">Dispatcher Login</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Dispatcher Login</h1>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required />

      <label>Password</label>
      <input type="password" id="password" required />

      <button type="submit">Login</button>

      <div id="errorMsg" class="error"></div>
    </form>
    <script type="module">
      // Firebase SDK
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      // Your Firebase Config
      const firebaseConfig = {
  apiKey: "AIzaSyXXXXXX",
  authDomain: "nationwide-dispatching-7b346.firebaseapp.com",
  projectId: "nationwide-dispatching-7b346",
  storageBucket: "nationwide-dispatching-7b346.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef123456"
};


      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);

          // Redirect to dashboard
          window.location.href = "dashboard.html";

        } catch (error) {
          document.getElementById("errorMsg").innerText =
            "Invalid login. Check your email or password.";
        }
      });
    </script>
  </main>

  <footer>
    <strong>Nationwide Dispatching</strong> · Phone: (619) 856-9888 · Email: nationwidedispatching@outlook.com<br />
    © 2026 Nationwide Dispatching — All Rights Reserved
  </footer>
</body>
</html>
