<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ELD Dashboard | Nationwide Dispatching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- LED Theme Styles -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #f2f2f2;
    }
    .sidebar {
      width: 250px;
      height: 100vh;
      background: #111;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 20px;
      border-right: 2px solid gold;
    }
    .sidebar h2 {
      text-align: center;
      color: gold;
      margin-bottom: 30px;
      font-size: 22px;
    }
    .sidebar a {
      display: block;
      padding: 15px 20px;
      color: #f2f2f2;
      text-decoration: none;
      font-size: 18px;
      border-bottom: 1px solid #222;
      transition: 0.3s;
    }
    .sidebar a:hover {
      background: gold;
      color: black;
    }
    .content {
      margin-left: 260px;
      padding: 20px;
    }
    h1 {
      color: gold;
      font-size: 28px;
      margin-bottom: 20px;
    }
    .box {
      background: #1a1a1a;
      padding: 20px;
      border: 2px solid gold;
      border-radius: 8px;
      margin-bottom: 25px;
    }
    .status-buttons button {
      background: gold;
      color: black;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
      margin-right: 10px;
      margin-bottom: 10px;
      transition: 0.3s;
    }
    .status-buttons button:hover {
      background: #d4af37;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      border: 2px solid gold;
    }
    th, td {
      padding: 12px;
      border: 1px solid #333;
      text-align: left;
    }
    th {
      background: gold;
      color: black;
      font-size: 18px;
    }
    tr:nth-child(even) {
      background: #141414;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <div class="sidebar">
    <h2>Dispatch Panel</h2>
    <a href="dashboard.html" style="background: gold; color: black;">Dashboard</a>
    <a href="loads.html">Loads</a>
    <a href="carriers.html">Carriers</a>
    <a href="documents.html">Documents</a>
    <a href="admin.html">Admin</a>
    <a href="dispatcher-login.html">Logout</a>
  </div>

  <div class="content">
    <h1>ELD Dashboard</h1>

    <div class="box">
      <h2>Current Duty Status: <span id="currentStatus">Unknown</span></h2>
      <div class="status-buttons">
        <button id="btnDriving">Driving</button>
        <button id="btnOnDuty">On Duty</button>
        <button id="btnOffDuty">Off Duty</button>
        <button id="btnSleeper">Sleeper Berth</button>
      </div>
      <p>All duty status changes are recorded as log entries in Firestore.</p>
    </div>

    <div class="box">
      <h2>Log History</h2>
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Time</th>
            <th>Changed By</th>
          </tr>
        </thead>
        <tbody id="logHistory"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Driver UID (from you)
    const driverUID = "q7BEObUuujURQc1hwJEK5gyeacm1";

    // Write a log entry
    function writeLogEntry(status) {
      const user = auth.currentUser;
      const who = user ? user.email : "Unknown";

      db.collection("eld_logs")
        .doc(driverUID)
        .collection("log_entries")
        .add({
          status: status,
          timestamp: new Date().toISOString(),
          changed_by: who
        });
    }

    // Update duty status + log it
    function updateDutyStatus(status) {
      db.collection("eld_state").doc(driverUID).set({
        status: status,
        updated: new Date().toISOString()
      });

      writeLogEntry(status);

      const el = document.getElementById("currentStatus");
      if (el) el.innerText = status;
    }

    // Wire buttons
    window.addEventListener("load", () => {
      const btnDriving = document.getElementById("btnDriving");
      const btnOnDuty = document.getElementById("btnOnDuty");
      const btnOffDuty = document.getElementById("btnOffDuty");
      const btnSleeper = document.getElementById("btnSleeper");

      if (btnDriving) btnDriving.onclick = () => updateDutyStatus("Driving");
      if (btnOnDuty) btnOnDuty.onclick = () => updateDutyStatus("On Duty");
      if (btnOffDuty) btnOffDuty.onclick = () => updateDutyStatus("Off Duty");
      if (btnSleeper) btnSleeper.onclick = () => updateDutyStatus("Sleeper Berth");
    });

    // Load current status
    db.collection("eld_state").doc(driverUID).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        const el = document.getElementById("currentStatus");
        if (el && data.status) el.innerText = data.status;
      }
    });

    // Real-time log history
    db.collection("eld_logs")
      .doc(driverUID)
      .collection("log_entries")
      .orderBy("timestamp", "desc")
      .onSnapshot(snapshot => {
        const table = document.getElementById("logHistory");
        if (!table) return;

        table.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const row = `
            <tr>
              <td>${data.status}</td>
              <td>${new Date(data.timestamp).toLocaleString()}</td>
              <td>${data.changed_by}</td>
            </tr>
          `;
          table.innerHTML += row;
        });
      });
  </script>
</body>
</html>
