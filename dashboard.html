<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dispatcher Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</head>

<body class="flex bg-gray-100">

<!-- Sidebar -->
<div class="w-64 bg-blue-800 text-white min-h-screen p-6">
    <h2 class="text-2xl font-bold mb-8">Nationwide Dispatching</h2>

    <a href="dashboard.html" class="block py-3 hover:bg-blue-700 rounded">Dashboard</a>
    <a href="loads.html" class="block py-3 hover:bg-blue-700 rounded">Loads</a>
    <a href="carriers.html" class="block py-3 hover:bg-blue-700 rounded">Carriers</a>
    <a href="documents.html" class="block py-3 hover:bg-blue-700 rounded">Documents</a>
    <a href="admin.html" class="block py-3 hover:bg-blue-700 rounded">Admin</a>

    <button onclick="logout()" class="mt-10 bg-red-600 w-full py-3 rounded hover:bg-red-700">
        Logout
    </button>
</div>

<!-- Main Content -->
<div class="flex-1 p-10">
    <h1 class="text-3xl font-bold mb-6">Dashboard</h1>

    <div class="grid grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded shadow">Active Loads</div>
        <div class="bg-white p-6 rounded shadow">Carriers</div>
        <div class="bg-white p-6 rounded shadow">Documents</div>
    </div>
</div>

<script>
function logout() {
    firebase.auth().signOut().then(() => {
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
