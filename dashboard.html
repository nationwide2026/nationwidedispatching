<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dispatcher Dashboard | Nationwide Dispatching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #050505;
      --bg-soft: #0b0b0b;
      --gold: #ffd700;
      --gold-soft: #e6c45a;
      --text: #f5f5f5;
      --muted: #b0b0b0;
      --danger: #ff6b6b;
      --success: #4caf50;
    }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #111 0%, #000 55%, #000 100%);
      color: var(--text);
      margin: 0;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #050505;
      border-right: 1px solid rgba(255,215,0,0.25);
      padding: 20px 16px;
      box-shadow: 8px 0 24px rgba(0,0,0,0.9);
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .sidebar-link {
      display: block;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 4px;
      transition: 0.2s;
    }

    .sidebar-link:hover {
      background: #111;
      color: var(--gold);
    }

    .sidebar-link.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #000;
      font-weight: 600;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,215,0,0.25);
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left {
      font-size: 16px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .content {
      padding: 20px;
      display: grid;
      grid-template-columns: 2fr 2fr;
      gap: 20px;
    }

    .panel {
      background: var(--bg-soft);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 16px 32px rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.8);
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 6px 4px;
      text-align: left;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    tr:nth-child(even) {
      background: #090909;
    }

    .form-input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #050505;
      color: var(--text);
      font-size: 13px;
    }

    .form-button {
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
    }

    .form-button:hover {
      background: var(--gold-soft);
    }

    .action-button {
      padding: 3px 6px;
      font-size: 11px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-right: 4px;
    }

    .edit-button {
      background: rgba(255,215,0,0.2);
      color: var(--gold);
    }

    .delete-button {
      background: rgba(255,107,107,0.2);
      color: var(--danger);
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="sidebar-title">Nationwide Dispatching</div>
    <a href="index.html" class="sidebar-link">Home</a>
    <a href="#" id="logoutBtn" class="sidebar-link">Logout</a>
    <a href="dashboard.html" class="sidebar-link active">ELD Dashboard</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">ELD & Dispatch Dashboard</div>
    </div>

    <div class="content">
      <div>
        <div class="panel">
          <div class="panel-title">Drivers & HOS</div>
          <table id="driversTable">
            <thead>
              <tr>
                <th>Driver</th>
                <th>Status</th>
                <th>Drive Left</th>
                <th>On Duty Left</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>      <div>
        <div class="panel">
          <div class="panel-title">Active Loads</div>
          <table id="loadsTable">
            <thead>
              <tr>
                <th>Load</th>
                <th>Lane</th>
                <th>Driver</th>
                <th>RPM</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-title">Add Load</div>
          <form id="addLoadForm">
            <input class="form-input" type="text" id="loadId" placeholder="Load ID" required />
            <input class="form-input" type="text" id="loadLane" placeholder="Lane (City A → City B)" required />
            <input class="form-input" type="text" id="loadDriver" placeholder="Assigned driver" required />
            <input class="form-input" type="number" step="0.01" id="loadRpm" placeholder="RPM (e.g. 2.75)" required />
            <input class="form-input" type="text" id="loadStatus" placeholder="Status (Booked / In Transit / Delivered)" required />
            <button class="form-button" type="submit">Add Load</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Driver GPS Map Panel -->
    <div class="content">
      <div class="panel" style="grid-column: 1 / span 2;">
        <div class="panel-title">Driver GPS Map</div>
        <div id="map" style="width:100%; height:400px; border-radius:12px;"></div>
      </div>
    </div>
    <!-- Google Maps JS -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_MAPS_API_KEY_HERE"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "nationwide-dispatching-7b346.firebaseapp.com",
        projectId: "nationwide-dispatching-7b346",
        storageBucket: "nationwide-dispatching-7b346.appspot.com",
        messagingSenderId: "280010805970",
        appId: "1:280010805970:web:42989433f02939aca3930b"
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      auth.onAuthStateChanged(user => {
        if (!user) {
          window.location.href = "dispatcher-login.html";
        } else {
          loadData();
        }
      });

      async function loadData() {
        const driversSnap = await db.collection("drivers").get();
        const loadsSnap = await db.collection("loads").get();

        renderDrivers(driversSnap.docs.map(d => ({ id: d.id, ...d.data() })));
        renderLoads(loadsSnap.docs.map(l => ({ id: l.id, ...l.data() })));
      }

      function renderDrivers(drivers) {
        const tbody = document.querySelector("#driversTable tbody");
        tbody.innerHTML = "";

        drivers.forEach(d => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${d.name}</td>
            <td>${d.status}</td>
            <td>${d.driveLeft}</td>
            <td>${d.onDutyLeft}</td>
            <td>
              <button class="action-button edit-button" data-type="driver" data-id="${d.id}">Edit</button>
              <button class="action-button delete-button" data-type="driver" data-id="${d.id}">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      function renderLoads(loads) {
        const tbody = document.querySelector("#loadsTable tbody");
        tbody.innerHTML = "";

        loads.forEach(l => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${l.id}</td>
            <td>${l.lane}</td>
            <td>${l.driver}</td>
            <td>${l.rpm}</td>
            <td>${l.status}</td>
            <td>
              <button class="action-button edit-button" data-type="load" data-id="${l.id}">Edit</button>
              <button class="action-button delete-button" data-type="load" data-id="${l.id}">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("addDriverForm").addEventListener("submit", async e => {
        e.preventDefault();

        const name = driverName.value.trim();
        const status = driverStatus.value.trim();
        const driveLeft = parseFloat(driverDriveLeft.value);
        const onDutyLeft = parseFloat(driverOnDutyLeft.value);

        if (!name) return;

        await db.collection("drivers").doc(name).set({
          name, status, driveLeft, onDutyLeft
        });

        e.target.reset();
        loadData();
      });

      document.getElementById("addLoadForm").addEventListener("submit", async e => {
        e.preventDefault();

        const id = loadId.value.trim();
        const lane = loadLane.value.trim();
        const driver = loadDriver.value.trim();
        const rpm = parseFloat(loadRpm.value);
        const status = loadStatus.value.trim();

        if (!id) return;

        await db.collection("loads").doc(id).set({
          id, lane, driver, rpm, status
        });

        e.target.reset();
        loadData();
      });

      document.addEventListener("click", async e => {
        const btn = e.target;
        if (!btn.dataset || !btn.dataset.id) return;

        const type = btn.dataset.type;
        const id = btn.dataset.id;

        if (btn.classList.contains("delete-button")) {
          await db.collection(type === "driver" ? "drivers" : "loads")
            .doc(id).delete();
          loadData();
        }

        if (btn.classList.contains("edit-button")) {
          const newStatus = prompt("Enter new status:");
          if (!newStatus) return;

          await db.collection(type === "driver" ? "drivers" : "loads")
            .doc(id).update({ status: newStatus });

          loadData();
        }
      });

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await auth.signOut();
        window.location.href = "dispatcher-login.html";
      });

      // MAP + LIVE DRIVER PINS
      let map;
      let driverMarkers = {};

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 39.8283, lng: -98.5795 },
          zoom: 4,
          styles: [
            { elementType: "geometry", stylers: [{ color: "#1a1a1a" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#ffffff" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#000000" }] },
            { featureType: "water", stylers: [{ color: "#0e0e0e" }] },
            { featureType: "road", stylers: [{ color: "#333333" }] }
          ]
        });
      }

      function createDriverMarker(d) {
        const marker = new google.maps.Marker({
          position: { lat: d.lat, lng: d.lng },
          map: map,
          title: d.name,
          icon: {
            url: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
          }
        });

        const infoWindow = new google.maps.InfoWindow({
          content: `
            <div style="font-size:14px;">
              <strong>${d.name}</strong><br>
              Status: ${d.status}<br>
              Drive Left: ${d.driveLeft} hrs<br>
              Duty Left: ${d.onDutyLeft} hrs<br>
              Last Update: ${d.lastUpdate || "N/A"}<br>
              Load: ${d.loadId || "None"}
            </div>
          `
        });

        marker.addListener("click", () => {
          infoWindow.open(map, marker);
        });

        return marker;
      }

      function updateDriverMarker(d) {
        if (!driverMarkers[d.name]) {
          driverMarkers[d.name] = createDriverMarker(d);
        }

        driverMarkers[d.name].setPosition({
          lat: d.lat,
          lng: d.lng
        });
      }

      db.collection("drivers").onSnapshot(snapshot => {
        snapshot.forEach(doc => {
          const d = doc.data();
          if (d.lat != null && d.lng != null) {
            updateDriverMarker(d);
          }
        });
      });

      window.onload = initMap;
    </script>
  </div>
</body>
</html>
