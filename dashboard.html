<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dispatcher Dashboard | Nationwide Dispatching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #050505;
      --bg-soft: #0b0b0b;
      --gold: #ffd700;
      --gold-soft: #e6c45a;
      --text: #f5f5f5;
      --muted: #b0b0b0;
      --danger: #ff6b6b;
      --success: #4caf50;
    }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #111 0%, #000 55%, #000 100%);
      color: var(--text);
      margin: 0;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #050505;
      border-right: 1px solid rgba(255,215,0,0.25);
      padding: 20px 16px;
      box-shadow: 8px 0 24px rgba(0,0,0,0.9);
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .sidebar-link {
      display: block;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 4px;
      transition: 0.2s;
    }

    .sidebar-link:hover {
      background: #111;
      color: var(--gold);
    }

    .sidebar-link.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #000;
      font-weight: 600;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,215,0,0.25);
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left {
      font-size: 16px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .content {
      padding: 20px;
      display: grid;
      grid-template-columns: 2fr 2fr;
      gap: 20px;
    }

    .panel {
      background: var(--bg-soft);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 16px 32px rgba(0,0,0,0.9),
        0 0 12px rgba(0,0,0,0.8);
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 6px 4px;
      text-align: left;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    tr:nth-child(even) {
      background: #090909;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .status-driving { background: rgba(76,175,80,0.15); color: var(--success); }
    .status-off { background: rgba(176,176,176,0.15); color: var(--muted); }
    .status-on { background: rgba(255,215,0,0.15); color: var(--gold-soft); }
    .status-violation { background: rgba(255,107,107,0.15); color: var(--danger); }

    .hos-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #111;
      overflow: hidden;
      margin-top: 4px;
    }

    .hos-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    }

    .hos-fill-danger {
      background: linear-gradient(90deg, #ff6b6b, #ffb199);
    }

    .form-input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #050505;
      color: var(--text);
      font-size: 13px;
    }

    .form-button {
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
    }

    .form-button:hover {
      background: var(--gold-soft);
    }

    .action-button {
      padding: 3px 6px;
      font-size: 11px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-right: 4px;
    }

    .edit-button {
      background: rgba(255,215,0,0.2);
      color: var(--gold);
    }

    .delete-button {
      background: rgba(255,107,107,0.2);
      color: var(--danger);
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="sidebar-title">Nationwide Dispatching</div>

    <a href="index.html" class="sidebar-link">Home</a>
    <a href="#" id="logoutBtn" class="sidebar-link">Logout</a>
    <a href="dashboard.html" class="sidebar-link active">ELD Dashboard</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">ELD & Dispatch Dashboard</div>
    </div>

    <div class="content">
      <div>
        <div class="panel">
          <div class="panel-title">Drivers & HOS</div>
          <table id="driversTable">
            <thead>
              <tr>
                <th>Driver</th>
                <th>Status</th>
                <th>Drive Left</th>
                <th>On Duty Left</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-title">Add Driver</div>
          <form id="addDriverForm">
            <input class="form-input" type="text" id="driverName" placeholder="Driver name" required />
            <input class="form-input" type="text" id="driverStatus" placeholder="Status (DRIVING / OFF DUTY / ON DUTY)" required />
            <input class="form-input" type="number" step="0.1" id="driverDriveLeft" placeholder="Drive left (hrs)" required />
            <input class="form-input" type="number" step="0.1" id="driverOnDutyLeft" placeholder="On duty left (hrs)" required />
            <button class="form-button" type="submit">Add Driver</button>
          </form>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-title">Active Loads</div>
          <table id="loadsTable">
            <thead>
              <tr>
                <th>Load</th>
                <th>Lane</th>
                <th>Driver</th>
                <th>RPM</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-title">Add Load</div>
          <form id="addLoadForm">
            <input class="form-input" type="text" id="loadId" placeholder="Load ID" required />
            <input class="form-input" type="text" id="loadLane" placeholder="Lane (City A → City B)" required />
            <input class="form-input" type="text" id="loadDriver" placeholder="Assigned driver" required />
            <input class="form-input" type="number" step="0.01" id="loadRpm" placeholder="RPM (e.g. 2.75)" required />
            <input class="form-input" type="text" id="loadStatus" placeholder="Status (Booked / In Transit / Delivered)" required />
            <button class="form-button" type="submit">Add Load</button>
          </form>
        </div>
      </div>
    </div>    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        getDocs,
        doc,
        setDoc,
        updateDoc,
        deleteDoc
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDXNZRDMmUJXoqMsFwluElbrSICN65Kmvc",
        authDomain: "nationwide-dispatching-7b346.firebaseapp.com",
        projectId: "nationwide-dispatching-7b346",
        storageBucket: "nationwide-dispatching-7b346.appspot.com",
        messagingSenderId: "280010805970",
        appId: "1:280010805970:web:42989433f02939aca3930b"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // LOGOUT
      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "dispatcher-login.html";
      });

      // AUTH PROTECTION
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          window.location.href = "dispatcher-login.html";
        } else {
          loadData();
        }
      });

      async function loadData() {
        const driversSnap = await getDocs(collection(db, "drivers"));
        const loadsSnap = await getDocs(collection(db, "loads"));

        const drivers = driversSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const loads = loadsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        renderDrivers(drivers);
        renderLoads(loads);
      }

      function renderDrivers(drivers) {
        const tbody = document.querySelector("#driversTable tbody");
        tbody.innerHTML = "";

        drivers.forEach(d => {
          const tr = document.createElement("tr");

          const statusClass =
            d.status === "DRIVING" ? "status-driving" :
            d.status === "OFF DUTY" ? "status-off" :
            d.status === "ON DUTY" ? "status-on" :
            "status-violation";

          const driveLeft = Number(d.driveLeft || 0);
          const onDutyLeft = Number(d.onDutyLeft || 0);

          tr.innerHTML = `
            <td>
              ${d.name}
              <div class="hos-bar">
                <div class="${driveLeft <= 1 ? "hos-fill-danger" : "hos-fill"}"
                     style="width:${Math.min(100, (driveLeft / 11) * 100)}%;"></div>
              </div>
            </td>
            <td><span class="status-pill ${statusClass}">${d.status}</span></td>
            <td>${driveLeft} hrs</td>
            <td>${onDutyLeft} hrs</td>
            <td>
              <button class="action-button edit-button" data-type="driver" data-id="${d.id}">Edit</button>
              <button class="action-button delete-button" data-type="driver" data-id="${d.id}">Delete</button>
            </td>
          `;

          tbody.appendChild(tr);
        });
      }

      function renderLoads(loads) {
        const tbody = document.querySelector("#loadsTable tbody");
        tbody.innerHTML = "";

        loads.forEach(l => {
          const tr = document.createElement("tr");
          const rpm = Number(l.rpm || 0);

          tr.innerHTML = `
            <td>${l.id}</td>
            <td>${l.lane}</td>
            <td>${l.driver}</td>
            <td>$${rpm.toFixed(2)}/mi</td>
            <td>${l.status}</td>
            <td>
              <button class="action-button edit-button" data-type="load" data-id="${l.id}">Edit</button>
              <button class="action-button delete-button" data-type="load" data-id="${l.id}">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // ADD DRIVER
      document.getElementById("addDriverForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("driverName").value.trim();
        const status = document.getElementById("driverStatus").value.trim();
        const driveLeft = parseFloat(document.getElementById("driverDriveLeft").value);
        const onDutyLeft = parseFloat(document.getElementById("driverOnDutyLeft").value);

        if (!name) return;

        await setDoc(doc(db, "drivers", name), {
          name,
          status,
          driveLeft,
          onDutyLeft
        });

        e.target.reset();
        await loadData();
      });

      // ADD LOAD
      document.getElementById("addLoadForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const id = document.getElementById("loadId").value.trim();
        const lane = document.getElementById("loadLane").value.trim();
        const driver = document.getElementById("loadDriver").value.trim();
        const rpm = parseFloat(document.getElementById("loadRpm").value);
        const status = document.getElementById("loadStatus").value.trim();

        if (!id) return;

        await setDoc(doc(db, "loads", id), {
          id,
          lane,
          driver,
          rpm,
          status
        });

        e.target.reset();
        await loadData();
      });

      // EDIT / DELETE HANDLERS
      document.addEventListener("click", async (e) => {
        const btn = e.target;
        if (!btn.dataset || !btn.dataset.type) return;

        const type = btn.dataset.type;
        const id = btn.dataset.id;

        if (btn.classList.contains("edit-button")) {
          if (type === "driver") {
            const ref = doc(db, "drivers", id);
            const newStatus = prompt("New status (DRIVING / OFF DUTY / ON DUTY):");
            const newDrive = prompt("New drive left (hrs):");
            const newOnDuty = prompt("New on duty left (hrs):");

            if (newStatus) {
              await updateDoc(ref, {
                status: newStatus,
                driveLeft: parseFloat(newDrive || 0),
                onDutyLeft: parseFloat(newOnDuty || 0)
              });
              await loadData();
            }
          } else if (type === "load") {
            const ref = doc(db, "loads", id);
            const newLane = prompt("New lane (City A → City B):");
            const newDriver = prompt("New assigned driver:");
            const newRpm = prompt("New RPM:");
            const newStatus = prompt("New status (Booked / In Transit / Delivered):");

            await updateDoc(ref, {
              lane: newLane || "",
              driver: newDriver || "",
              rpm: parseFloat(newRpm || 0),
              status: newStatus || ""
            });
            await loadData();
          }
        }

        if (btn.classList.contains("delete-button")) {
          const confirmDelete = confirm(`Delete this ${type}?`);
          if (!confirmDelete) return;

          if (type === "driver") {
            await deleteDoc(doc(db, "drivers", id));
          } else if (type === "load") {
            await deleteDoc(doc(db, "loads", id));
          }
          await loadData();
        }
      });
    </script>
  </div>
</body>
</html>
