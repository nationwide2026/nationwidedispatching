<!DOCTYPE html>
<html>
<head>
  <title>Dispatcher Dashboard</title>
</head>
<body>
  <h2>Dispatcher Dashboard</h2>

  <div id="content">Loading...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const content = document.getElementById("content");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "dispatcher-login.html";
        return;
      }

      const ref = doc(db, "dispatcher_registrations", user.uid);
      const snap = await getDoc(ref);

      if (!snap.exists() || !snap.data().approved) {
        content.textContent = "You are not approved.";
        return;
      }

      content.innerHTML = `
        <h3>Welcome Dispatcher</h3>
        <ul>
          <li><a href="loads.html">Loads</a></li>
          <li><a href="carriers.html">Carriers</a></li>
          <li><a href="documents.html">Documents</a></li>
        </ul>
      `;
    });
  </script>
</body>
</html>
