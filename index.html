<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nationwide Dispatching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-dark: #050608;
      --bg-darker: #020305;
      --gold: #f5c451;
      --gold-soft: #e3b34a;
      --text-light: #f9f9f9;
      --text-muted: #c0c0c0;
      --accent: #1f2933;
      --border-gold: rgba(245,196,81,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #111827 0, #020305 55%, #000000 100%);
      color: var(--text-light);
      line-height: 1.6;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border-gold);
      background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(15,23,42,0.9));
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-wrap {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      overflow: hidden;
      background: radial-gradient(circle, #111827 0, #020305 60%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .brand-text span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      font-size: 0.9rem;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.75rem;
      position: relative;
      padding-bottom: 0.2rem;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(to right, var(--gold), var(--gold-soft));
      transition: width 0.2s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 2rem;
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 2.5rem;
      align-items: center;
    }

    .hero-main h2 {
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .hero-main h2 span {
      color: var(--gold);
    }

    .hero-tagline {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 1.5rem;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .badge {
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      padding: 0.35rem 0.8rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(15,23,42,0.7);
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .btn-primary {
      background: linear-gradient(to right, var(--gold), var(--gold-soft));
      color: #111827;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border: none;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 0 25px rgba(245,196,81,0.35);
    }

    .btn-outline {
      background: transparent;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border: 1px solid var(--border-gold);
      color: var(--text-light);
      cursor: pointer;
    }

    .hero-contact {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .hero-contact strong {
      color: var(--gold);
    }

    .hero-logo-card {
      border-radius: 18px;
      border: 1px solid var(--border-gold);
      background: radial-gradient(circle at top, #111827 0, #020305 55%);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.7);
    }

    .hero-logo-card img {
      width: 100%;
      max-width: 260px;
      border-radius: 12px;
      object-fit: cover;
    }

    .hero-logo-card h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--gold);
    }

    .hero-logo-card p {
      font-size: 0.8rem;
      color: var(--text-muted);
      max-width: 280px;
    }

    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
      border-top: 1px solid rgba(31,41,55,0.7);
    }

    .section-header {
      margin-bottom: 1.25rem;
    }

    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--gold-soft);
    }

    .section-title {
      font-size: 1.2rem;
      margin-top: 0.25rem;
    }

    .section-grid {
      display: grid;
